version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos-backend
    environment:
      - DATABASE_URL=file:/app/dev.db
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - APP_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - db_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos-frontend
    environment:
      - VITE_API_URL=http://host.docker.internal:3000
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data: